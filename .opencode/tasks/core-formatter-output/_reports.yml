    text: |
      packages/core/src/clapp.ts: в Clapp добавлена инъекция
      `@inject(FORMATTER_MANAGER_TOKEN) formatterManager!: IPluginManager<IPluginFormatter>`;
      в _commandAction после успешного plugin.action(...) и до command:end вызывается новый приватный
      метод formatCommandResult(definition, result): при наличии definition.formatter берёт плагин
      через formatterManager.getInstance(formatter), вызывает format(result.data) и пишет строку в
      process.stdout.write (добавляет '\n', если строка им не завершается). Пустая строка не печатается
      вовсе (early return). Команда без formatter не печатает здесь ничего.
      Порядок выбран так, чтобы ошибка форматирования попадала в существующий catch → command:error →
      resolveExitCode (exit 1), а command:end эмитился только после успешного вывода.
      Проверено: демо demo-list/demo-table (отформатированный вывод, exit 0), demo-empty (пустой вывод,
      exit 0 без лишней строки), demo-plain (команда без formatter печатает сама).
