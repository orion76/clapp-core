         у них нет своего флага результата.
      7) Одна длинная строка (>120) — import-список типов в mcp.ts (139 символов): prettier
         (printWidth 140 из `.prettierrc.json`) собирает такой import в одну строку, и в репозитории
         это уже есть (registry.ts:1 — 133). Остальные новые строки ≤120.

