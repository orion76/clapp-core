        шаблон регистрируется перегрузкой `registerResource(name, uriOrTemplate: ResourceTemplate,
        ...)`; так и сделано.

      ОКРУЖЕНИЕ (важно для д1 и для запуска движка)
      - Проба требует `tmp/tsconfig.mcp-probe.json`, иначе tsx не применяет `experimentalDecorators`
        к лежащим в `tmp/` файлам (root tsconfig их исключает): воспроизводится минимальным
        `tmp/decorator-probe.ts` — esbuild трактует декораторы как стандартные, и inversify падает
        на `target.constructor`. Тот же конфиг маппит `@orion76/*` на собранные пакеты в
        `node_modules` (их TS-исходники по paths root tsconfig под tsx не грузятся). То есть
        реальный запуск движка под tsx возможен, но требует либо `--tsconfig` с такими путями,
        либо файла-точки входа внутри `packages/**`; на сборку (rollup) это не влияет.

