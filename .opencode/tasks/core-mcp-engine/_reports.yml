         часть всех трёх поверхностей, а не логика конкретной; `undefined` в позиции
         необязательного аргумента сохранён ради совместимости с CLI (`?? default` в командах).
      3) В `opts` попадают только присланные опции, как в `Command.opts()`: иначе default
         команды (`defaultValue` в схеме) перестал бы применяться.
      4) Декодирование строк URI-шаблона в объявленный тип опции (`boolean`/`number`) добавлено
         поверх конвенций § 6.2 — иначе `?json=false` приходило бы в команду строкой и было бы
         истинным. Для tool/prompt декодирование не срабатывает (значения уже типизированы схемой).
      5) Шаблон ресурса матчится SDK строго: каждый вариативный параметр обязателен в URI
         (`clapp://npm-info` без query даёт `match → null`), `resources/list` шаблон не перечисляет
         (в списке только `resources/templates/list`, потому что `list`-callback не задан). Это
         следствие конвенции `clapp://<путь>{?arg1,arg2}`, а не выбор реализации; важно для д1
