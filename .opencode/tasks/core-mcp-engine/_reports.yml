          (отсутствующий/неверный тип → ошибка запроса);
        * движок целиком: `initialize()` собрал реестр (tools/resources/prompts + skipped
          `no-formatter: no formatter declared` с предупреждением в stderr), `createServer()`
          зарегистрировал все три поверхности, вызовы прошли через `executeCommand`
          (getArguments → action) и `renderResult`.
      - Шов форматтера проверен подменой резолвера: с подставленным `format(id, data)` все три
        поверхности вернули его текст и данные команды, ничего в поверхностях менять не пришлось —
        то есть `в5` подключается заменой провайдера.
